services:
  - type: web
    name: serverless-lab
    env: python
    plan: free
    branch: main
    pythonVersion: "3.11.8"
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --port=$PORT main:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: serverless-db
          property: connectionString